[project]
name = "solver"
version = "0.1.0"
description = "Call LLMs to produce Catan placement choices"
requires-python = ">=3.12"
dependencies = [
    # 4.16 requires OpenTelemetry >=1.45, which logfire (via pydantic-ai) rejects.
    "langfuse>=4.15.6,<4.16",
    "openai>=3.26.0",
    "pydantic-ai>=2.50",
    "pydantic-settings",
    "shared",
    "simulation",
    "tqdm>=4.70.1",
    "types-tqdm>=4.70.0.20260906",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
solve = "solver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
