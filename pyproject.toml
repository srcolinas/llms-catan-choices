[project]
name = "llms-catan-choices"
version = "0.1.0"
description = "Benchmark LLM Catan building-placement choices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
shared = { workspace = true }
simulation = { workspace = true }
solver = { workspace = true }

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
target-version = "py312"
src = ["packages"]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages/shared/src:packages/solver/src:packages/simulation/src"
explicit_package_bases = true
files = ["packages"]

[[tool.mypy.overrides]]
module = "simulation._native"
ignore_missing_imports = true
